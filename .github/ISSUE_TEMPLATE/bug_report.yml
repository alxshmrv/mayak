name: Ошибка
description: Сообщить о воспроизводимой проблеме в Маяке
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Не публикуйте реальные SSID, BSSID, IP, MAC, имена устройств или базы данных.
        Для уязвимостей используйте приватный security advisory.
  - type: input
    id: version
    attributes:
      label: Версия Маяка
      placeholder: 0.2.0
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Платформа
      options:
        - macOS, Apple Silicon
        - Windows, x64
        - Неподдерживаемая или другая система
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Версия системы и устройство
      description: Укажите версию ОС, модель компьютера или важные сведения об оборудовании.
      placeholder: macOS 15.x, MacBook Pro M3 или Windows 11 24H2, x64
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Шаги воспроизведения
      description: Используйте вымышленные или замаскированные сетевые данные.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Ожидаемое поведение
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Фактическое поведение
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Приватность
      options:
        - label: Я удалил(а) реальные сетевые и персональные данные из отчёта.
          required: true
