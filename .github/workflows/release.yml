name: Release installers

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS DMG
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Build DMG
        run: npm run tauri build -- --bundles dmg

      - name: Prepare macOS release asset
        shell: bash
        run: |
          mkdir -p release-assets
          version="$(node -p 'require("./package.json").version')"
          source_dmg="$(find src-tauri/target/release/bundle/dmg -maxdepth 1 -name '*.dmg' -print -quit)"
          test -n "$source_dmg"
          asset_name="Mayak-${version}-macos-arm64.dmg"
          cp "$source_dmg" "release-assets/$asset_name"
          (cd release-assets && shasum -a 256 "$asset_name" > "$asset_name.sha256")

      - name: Upload macOS installer
        uses: actions/upload-artifact@v7
        with:
          name: macos-installer
          path: release-assets/*
          if-no-files-found: error

  build-windows:
    name: Build Windows installers
    runs-on: windows-latest
    timeout-minutes: 50

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Build NSIS and MSI installers
        run: npm run tauri build -- --bundles nsis,msi

      - name: Prepare Windows release assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-assets | Out-Null
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $setup = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          $msi = Get-ChildItem src-tauri/target/release/bundle/msi/*.msi | Select-Object -First 1
          if (-not $setup -or -not $msi) { throw "Windows installers were not produced" }
          $setupTarget = "release-assets/Mayak-$version-windows-x64-setup.exe"
          $msiTarget = "release-assets/Mayak-$version-windows-x64.msi"
          Copy-Item $setup.FullName $setupTarget
          Copy-Item $msi.FullName $msiTarget
          (Get-FileHash $setupTarget -Algorithm SHA256).Hash.ToLower() + "  " + (Split-Path $setupTarget -Leaf) | Set-Content "$setupTarget.sha256"
          (Get-FileHash $msiTarget -Algorithm SHA256).Hash.ToLower() + "  " + (Split-Path $msiTarget -Leaf) | Set-Content "$msiTarget.sha256"

      - name: Upload Windows installers
        uses: actions/upload-artifact@v7
        with:
          name: windows-installers
          path: release-assets/*
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download installers
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish installers
        uses: softprops/action-gh-release@v3
        with:
          prerelease: true
          generate_release_notes: true
          files: release-assets/*
