name: Release installers

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release metadata
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"

      - name: Verify synchronized versions
        shell: bash
        run: |
          set -euo pipefail
          package_version="$(node -p 'require("./package.json").version')"
          tauri_version="$(node -p 'require("./src-tauri/tauri.conf.json").version')"
          cargo_version="$(sed -n 's/^version = "\(.*\)"/\1/p' src-tauri/Cargo.toml | head -1)"
          test "$package_version" = "$tauri_version"
          test "$package_version" = "$cargo_version"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            test "${GITHUB_REF_NAME#v}" = "$package_version"
          fi

  build:
    name: Build ${{ matrix.name }}
    needs: validate
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: write
    strategy:
      fail-fast: false
      # tauri-action merges platform entries into one latest.json. Serializing
      # prevents two matrix jobs from overwriting that shared manifest.
      max-parallel: 1
      matrix:
        include:
          - name: macOS DMG
            runner: macos-15
            # The app bundle is the signed .app.tar.gz updater payload; the DMG
            # remains the installer people download from the release page.
            bundles: app,dmg
          - name: Windows NSIS and MSI
            runner: windows-latest
            bundles: nsis,msi

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm

      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Build signed updater artifacts
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: "Маяк __VERSION__ — macOS и Windows"
          releaseBody: |
            Выберите готовый установщик: DMG для Apple Silicon, setup.exe для
            обычной установки Windows или MSI для управляемого развёртывания.
            Архивы Source code не являются установщиками.
          generateReleaseNotes: true
          releaseDraft: true
          prerelease: false
          args: --bundles ${{ matrix.bundles }}
          retryAttempts: 2
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          uploadUpdaterSignatures: true
          releaseAssetNamePattern: "Mayak-[version]-[platform]-[arch][setup][ext]"
          uploadWorkflowArtifacts: true
          workflowArtifactNamePattern: "${{ matrix.name }}"

  finalize:
    name: Verify and finalize release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"

      - name: Download published assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release download "$GITHUB_REF_NAME" --dir release-assets

      - name: Validate updater manifest
        run: node scripts/validate-updater-manifest.mjs release-assets/latest.json "${GITHUB_REF_NAME#v}"

      - name: Create installer checksums
        shell: bash
        run: |
          set -euo pipefail
          for extension in dmg exe msi; do
            test -n "$(find release-assets -maxdepth 1 -type f -name "*.$extension" -print -quit)"
          done
          find release-assets -maxdepth 1 -type f \
            \( -name '*.dmg' -o -name '*.exe' -o -name '*.msi' \) \
            -print0 |
            while IFS= read -r -d '' asset; do
              name="$(basename "$asset")"
              (cd release-assets && sha256sum "$name" > "$name.sha256")
            done

      - name: Upload checksums and mark latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "$GITHUB_REF_NAME" release-assets/*.sha256 --clobber
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
