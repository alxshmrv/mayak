name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS checks
    runs-on: macos-15
    timeout-minutes: 30
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: app-build
          add-job-id-key: "false"
          workspaces: src-tauri -> target
          cache-bin: "false"

      - name: Install frontend dependencies
        run: npm ci

      - name: Check frontend
        run: npm run check

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Lint Rust
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Test Rust
        run: cargo test --manifest-path src-tauri/Cargo.toml --all-targets

  windows-lint:
    name: Windows lint
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: lint
          add-job-id-key: "false"
          workspaces: src-tauri -> target
          cache-bin: "false"

      - name: Lint Rust
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

  windows:
    name: Windows checks
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: app-build
          add-job-id-key: "false"
          workspaces: src-tauri -> target
          cache-bin: "false"

      - name: Install frontend dependencies
        run: npm ci

      - name: Test Rust
        run: cargo test --manifest-path src-tauri/Cargo.toml --all-targets

      - name: Build Windows installer smoke
        if: github.event_name == 'pull_request'
        # Pull requests never receive release signing secrets. This job only
        # smoke-tests both installer formats in the already compiled debug
        # profile; pushes to main and release.yml still build release binaries.
        run: >-
          npm run tauri build -- --debug --bundles nsis,msi
          --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: Build Windows release installers
        if: github.event_name == 'push'
        run: >-
          npm run tauri build -- --bundles nsis,msi
          --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: Upload Windows installer smoke artifacts
        uses: actions/upload-artifact@v7
        with:
          name: windows-installer-smoke
          path: |
            src-tauri/target/debug/bundle/nsis/*.exe
            src-tauri/target/debug/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
